<div class="container mt-3">
  <table class="table table-striped table-hover table-bordered align-middle">
    <thead class="table-light text-center">
      <tr>
        <th>Id Departamento</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody class="text-center">
      @for (departamento of departamentos; track departamento.idDepartamento) {
        <tr>
          <th scope="row">
            {{ departamento.idDepartamento }}
          </th>

          <td>
            {{ departamento.nombre }}
          </td>

          <td>
            <button
              class="btn btn-warning btn-sm me-3"
              (click)="editarDepartamento(departamento.idDepartamento)"
            >
              Editar
            </button>

            <button
              class="btn btn-danger btn-sm"
              (click)="eliminarDepartamento(departamento.idDepartamento)"
            >
              Eliminar
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
